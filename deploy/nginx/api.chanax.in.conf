# api.chanax.in: HTTPS only. Port 80 does nothing but redirect (and answer Let's Encrypt
# certificate checks); everything else is served on port 443.
#
# Certificates come from Let's Encrypt via certbot (certbot --nginx -d api.chanax.in).
# The ssl_* lines below are the standard certbot paths. If the server's certbot already
# generated its own copy of this file, compare it with this one and keep its certificate
# lines; the redirect, headers and rate limits are the parts to carry over.

# Request-rate zones. This file is included inside nginx's `http {}` block, which is
# where limit_req_zone must live. If your nginx loads it elsewhere, move these two
# lines into the main http block.
limit_req_zone $binary_remote_addr zone=chanax_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=chanax_send:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.chanax.in;

    # Lets certbot renew the certificate without going through the redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Everything else, API calls included, is sent to HTTPS and never answered in clear.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.chanax.in;

    ssl_certificate /etc/letsencrypt/live/api.chanax.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.chanax.in/privkey.pem;
    # certbot's recommended settings: TLS 1.2 and 1.3 only, modern ciphers.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Marketing uploads and PDF email/WhatsApp sends exceed nginx's 1 MB default.
    client_max_body_size 25m;

    # Security headers for every API reply (the API only returns JSON, so nothing may
    # run or be framed). Locations below add no add_header lines of their own, so they
    # inherit these. "always" keeps them on error replies such as 429.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # Everything: 10 requests/second per IP, short bursts of 40 allowed.
    limit_req zone=chanax_api burst=40 nodelay;
    limit_req_status 429;

    # Strict zone for endpoints that send messages or cost money.
    location ~ ^/api/v1/(account/phone/send-code|documents/(document-email|document-whatsapp|employee-letter-email|payslip-email)|team/invitations|ca-partners/client-invitations)$ {
        limit_req zone=chanax_send burst=10 nodelay;
        limit_req zone=chanax_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
