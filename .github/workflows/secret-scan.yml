name: Secret scan
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_history:
        description: "Scan the entire Git history (older, already-rotated leaks will be reported)"
        type: boolean
        default: false
permissions:
  contents: read
env:
  GITLEAKS_VERSION: "8.28.0"
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "$base/$file"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" gitleaks
      - name: Scan the files in this checkout
        run: ./gitleaks dir . --config .gitleaks.toml --redact --no-banner --verbose
      - name: Scan the commits in this change
        if: github.event_name != 'workflow_dispatch'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            range="-1 ${{ github.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose --log-opts="$range"
      - name: Scan the full history (manual run)
        if: github.event_name == 'workflow_dispatch' && inputs.full_history
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose
