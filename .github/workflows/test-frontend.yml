name: Test ChanaX frontend
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/test-frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/test-frontend.yml"]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:errors
      - run: npm run test:gst
      - run: npm run test:ca
      - run: npm run lint
      - run: npm run build
